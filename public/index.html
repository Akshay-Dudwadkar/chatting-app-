<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Velvet — Private Messaging</title>
  <meta name="description" content="Velvet is a premium private messaging experience with real-time chat." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div class="app-container">

    <!-- ═══════════════ LOGIN ═══════════════ -->
    <div id="login-screen" class="panel">
      <div class="login-ambient"></div>
      <div class="login-card">
        <div class="login-brand">
          <div class="brand-mark">V</div>
          <h1>Velvet</h1>
          <p class="login-tagline">Private. Encrypted. Yours.</p>
        </div>
        <form id="login-form">
          <div class="field">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" autocomplete="username" placeholder="Enter your identity" required />
          </div>
          <div class="field">
            <label for="login-password">Passphrase</label>
            <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" required />
          </div>
          <button type="submit" id="login-submit-btn">Enter</button>
          <p class="hint"></p>
        </form>
        <div id="login-error" class="error"></div>
      </div>
    </div>

    <!-- ═══════════════ CHAT APP ═══════════════ -->
    <div id="chat-app" class="panel hidden">
      <div class="chat-layout">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-header">
            <h2 id="sidebar-title">Dashboard</h2>
            <div class="sidebar-menu">
              <button type="button" id="menu-btn" class="icon-btn" title="Menu" aria-label="Open menu">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="4" cy="10" r="1.5" fill="currentColor"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/><circle cx="16" cy="10" r="1.5" fill="currentColor"/></svg>
              </button>
              <div id="menu-dropdown" class="menu-dropdown hidden">
                <button type="button" id="create-user-menu-btn" class="menu-item">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                  New User
                </button>
                <button type="button" id="manage-users-menu-btn" class="menu-item">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                  Manage
                </button>
                <button type="button" id="view-stats-menu-btn" class="menu-item">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                  Statistics
                </button>
                <div class="menu-divider"></div>
                <button type="button" id="dark-mode-menu-btn" class="menu-item">
                  <span id="dark-mode-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                  </span>
                  Theme
                </button>
                <button type="button" id="wa-mode-menu-btn" class="menu-item">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8L21 21l-5.8-1.9a8.5 8.5 0 1 1 6.8-7.6z"/></svg>
                  WhatsApp Mode
                </button>
                <button type="button" id="logout-menu-btn" class="menu-item menu-item--danger">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                  Sign Out
                </button>
              </div>
            </div>
          </div>

          <div class="owner-info">
            <div class="owner-avatar"><span>O</span></div>
            <div class="owner-details">
              <h3>Owner</h3>
              <p>Administrator</p>
            </div>
          </div>

          <div class="user-section">
            <h3>Conversations</h3>
            <div id="user-list" class="user-list"></div>
          </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="chat-area">
          <div id="chat-header" class="chat-header">
            <div class="chat-info-header">
              <button id="back-to-list-btn" class="icon-btn back-btn hidden" title="Back" aria-label="Back to list">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <div class="chat-info">
                <div class="avatar" id="chat-avatar">
                  <span id="chat-avatar-letter"></span>
                </div>
                <div>
                  <h3 id="chat-partner-name">Select a conversation</h3>
                  <span id="chat-status">Pick someone from the sidebar</span>
                </div>
              </div>
            </div>
            <div class="chat-actions">
              <button type="button" id="search-btn" class="icon-btn" title="Search Messages" aria-label="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </button>
              <button type="button" id="call-btn" class="icon-btn" title="Voice Call" aria-label="Call">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </button>
              <button type="button" id="notify-btn" class="icon-btn" title="Notify" aria-label="Notify">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0v3l-2 2v1h16v-1l-2-2V8"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              </button>
              <button type="button" id="more-btn" class="icon-btn" title="More Options" aria-label="More">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
              </button>
            </div>
          </div>

          <div id="message-search" class="message-search hidden">
            <input type="text" id="search-input" class="search-input" placeholder="Search messages…" />
            <div id="search-results" class="search-results hidden"></div>
          </div>

          <div id="pinned-messages" class="pinned-messages hidden"></div>

          <div id="messages" class="messages">
            <div class="welcome-message">
              <div class="welcome-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              </div>
              <h2>Welcome to Velvet</h2>
              <p>Select a conversation to begin</p>
            </div>
          </div>

          <div class="message-input-area">
            <div id="reply-preview" class="reply-preview hidden"></div>
            <div id="file-preview" class="file-preview hidden"></div>
            <form id="message-form" class="message-form">
              <label class="file-upload" title="Attach file">
                <input type="file" id="file-input" />
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              </label>
              <button type="button" id="emoji-btn" class="icon-btn emoji-btn" title="Insert emoji" aria-label="Emoji">😊</button>
              <input type="text" id="message-input" placeholder="Write a message…" autocomplete="off" />
              <button type="button" id="voice-record-btn" class="icon-btn voice-record-btn" title="Record voice message" aria-label="Record">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              </button>
              <button type="submit" class="send-btn" id="send-btn" aria-label="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </form>
          </div>
        </main>
      </div>
    </div>

    <!-- ═══════════════ MODALS ═══════════════ -->
    <div id="create-user-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Create New User</h3>
        <form id="create-user-form">
          <div class="field">
            <input type="text" id="new-username" placeholder="Username" required />
          </div>
          <div class="field">
            <input type="password" id="new-password" placeholder="Password" required />
          </div>
          <div class="form-buttons">
            <button type="submit">Create</button>
            <button type="button" id="cancel-create">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="manage-users-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Manage Users</h3>
        <div id="manage-user-list"></div>
        <button type="button" id="close-manage" class="btn-secondary">Close</button>
      </div>
    </div>

    <div id="user-actions-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Actions for <span id="action-username"></span></h3>
        <div class="modal-actions">
          <button type="button" id="set-email-btn">Set Email</button>
          <button type="button" id="notify-user-btn">Notify User</button>
          <button type="button" id="change-password-btn">Change Password</button>
          <button type="button" id="delete-chat-btn" class="danger">Delete Chat</button>
            <button type="button" id="delete-user-btn" class="danger">Delete User</button>
          <button type="button" id="close-actions" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <div id="change-password-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Change Password for <span id="change-username"></span></h3>
        <form id="change-password-form">
          <div class="field">
            <input type="password" id="change-password-input" placeholder="New Password" required />
          </div>
          <div class="form-buttons">
            <button type="submit">Update</button>
            <button type="button" id="cancel-change">Cancel</button>
          </div>
        </form>
      </div>
    </div>

  </div>
  
    <div id="notify-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Send Notification</h3>
        <form id="notify-form">
          <div class="field">
            <label for="notify-recipient">Recipient</label>
            <select id="notify-recipient">
              <option value="owner">Owner</option>
            </select>
          </div>
          <div class="field notify-options hidden">
            <label for="notify-permanent">
              <input type="checkbox" id="notify-permanent" /> Permanent announcement for all users
            </label>
          </div>
          <div class="field">
            <label for="notify-email">Your Email (optional)</label>
            <input type="email" id="notify-email" placeholder="your.email@gmail.com" />
          </div>
          <div class="field">
            <label for="notify-message">Message</label>
            <textarea id="notify-message" rows="4" placeholder="Enter notification message" required></textarea>
          </div>
          <div class="form-buttons">
            <button type="submit">Send</button>
            <button type="button" id="cancel-notify">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  <script src="app.js"></script>
</body>
</html>
